name: FM1 native host integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/audio/**'
      - 'scripts/integrate_pad.py'
      - 'tests/test_pad.c'
      - 'tests/render_pad_wav.c'
      - 'tests/test_bass.c'
      - 'tests/native_host.txt'
      - '.github/workflows/native-host.yml'
permissions:
  contents: write
concurrency:
  group: groovescape-native-build
  cancel-in-progress: false
jobs:
  pad-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C DSP smoke test
        run: |
          set -o pipefail
          {
            cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_pad.c firmware/audio/pad_dsp.c -lm -o /tmp/gs-pad-test
            /tmp/gs-pad-test
            cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=undefined -fno-omit-frame-pointer tests/test_bass.c firmware/audio/bass_dsp.c -lm -o /tmp/gs-bass-test
            /tmp/gs-bass-test
          } 2>&1 | tee /tmp/groovescape-dsp-test.log
      - name: Render offline ToneScape listening preview
        run: |
          mkdir -p .work/preview
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/render_pad_wav.c firmware/audio/pad_dsp.c -lm -o /tmp/gs-render-preview
          /tmp/gs-render-preview .work/preview/tonescape-pad-preview.wav
          test -s .work/preview/tonescape-pad-preview.wav
      - name: Upload offline listening preview
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-tonescape-audio-preview
          path: .work/preview/tonescape-pad-preview.wav
          if-no-files-found: error
      - name: Validate integration script syntax
        run: python3 -m py_compile scripts/integrate_pad.py
      - name: Validate strict native C build before FM1 integration
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -c firmware/audio/pad_dsp.c -o /tmp/gs-pad.o
          cc -std=c11 -O2 -Wall -Wextra -Werror -c firmware/audio/bass_dsp.c -o /tmp/gs-bass.o
          cc -std=c11 -O2 -Wall -Wextra -Werror tests/render_pad_wav.c firmware/audio/pad_dsp.c -lm -o /tmp/gs-preview-strict

      - name: Install FM1 build Python dependencies
        run: python3 -m pip install --disable-pip-version-check Pillow
      - name: Get fm1-base
        run: git clone --depth 1 --recurse-submodules https://github.com/charlesvestal/fm1-base.git .work/fm1-base
      - name: Create GrooveScape firmware from upstream template
        run: |
          set -o pipefail
          python3 scripts/integrate_pad.py 2>&1 | tee /tmp/groovescape-integration.log
      - name: Check generated native integration before build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app = Path('.work/fm1-base/groovescape/app.c').read_text()
          assert app.count('gs_pad_render(&gs_voice, lr, n, master_q12);') == 1
          assert app.count('gs_pad_environment(&gs_voice,') >= 2
          assert app.count('gs_bass_mix(&gs_bass_voice, lr, n, master_q12);') == 1\n          assert app.count('gs_lead_mix(&gs_lead_voice, lr, n, master_q12);') == 1\n          assert app.count('gs_drums_mix(&gs_drum_voice, lr, n, master_q12, gs_tempo);') == 1
          assert 'gs_env_names[gs_env_index]' in app
          assert 'voice_level' not in app
          print('Native app integration and environment controls verified')
          PY
      - name: Build host simulator
        run: |
          set -o pipefail
          .work/fm1-base/tools/build.py .work/fm1-base/groovescape --host 2>&1 | tee /tmp/groovescape-host-build.log
      - name: Run FM1 host UI and audio smoke test
        run: |
          set -o pipefail
          .work/fm1-base/groovescape/build/host/groovescape_host tests/native_host.txt .work/fm1-base/groovescape/build/host 2>&1 | tee /tmp/groovescape-host-test.log
      - name: Preserve host diagnostics
        if: always()
        run: |
          mkdir -p .work/diagnostics
          cp /tmp/groovescape-dsp-test.log /tmp/groovescape-integration.log /tmp/groovescape-host-build.log /tmp/groovescape-host-test.log .work/diagnostics/ 2>/dev/null || true
      - name: Upload host diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-build-diagnostics
          path: .work/diagnostics/
          if-no-files-found: ignore
      - name: Publish host diagnostics for automated debugging
        if: always() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p ci-diagnostics
          {
            echo "Commit: $GITHUB_SHA"
            echo "Host stage status: ${{ job.status }}"
            echo "Run: $GITHUB_RUN_ID"
            echo "DSP test log (last 120 lines):"
            tail -n 120 /tmp/groovescape-dsp-test.log 2>/dev/null || true
            echo "Integration log (last 120 lines):"
            tail -n 120 /tmp/groovescape-integration.log 2>/dev/null || true
            echo "Host build log (last 120 lines):"
            tail -n 120 /tmp/groovescape-host-build.log 2>/dev/null || true
            echo "Host test log (last 120 lines):"
            tail -n 120 /tmp/groovescape-host-test.log 2>/dev/null || true
          } > ci-diagnostics/latest-host.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-diagnostics/latest-host.txt
          if ! git diff --cached --quiet; then
            git commit -m "Record native CI host failure diagnostics [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Upload host smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-host-smoke
          path: .work/fm1-base/groovescape/build/host/
          if-no-files-found: ignore
      - name: Install Emscripten for browser build
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
      - name: Build browser emulator
        run: .work/fm1-base/tools/build.py .work/fm1-base/groovescape --web
      - name: Verify browser emulator entrypoint
        run: |
          test -s .work/fm1-base/groovescape/build/emu/index.html
          test -s .work/fm1-base/groovescape/build/emu/app.wasm
          test -s .work/fm1-base/groovescape/build/emu/app.js
          test -s .work/fm1-base/groovescape/build/emu/worklet.js
          test -s .work/fm1-base/groovescape/build/emu/app_worklet.js
          python3 - <<'PY'
          from pathlib import Path
          wasm = Path('.work/fm1-base/groovescape/build/emu/app.wasm').read_bytes()
          print('WASM first 16 bytes:', wasm[:16].hex(), 'size:', len(wasm))
          assert len(wasm) > 1024, 'WebAssembly asset unexpectedly small'
          # The actual module header will be checked separately once the
          # fm1-base web packaging format has been identified.
          print('Verified native emulator assets and WebAssembly header')
          PY
          find .work/fm1-base/groovescape/build/emu -maxdepth 1 -type f -printf "%f %s bytes\\n"
      - name: Publish verified native emulator to GitHub Pages folder
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p native
          cp -a .work/fm1-base/groovescape/build/emu/. native/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f native
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested GrooveScape FM1 browser emulator [skip ci]"
            git pull --rebase origin main
          git push origin HEAD:main
          fi
      - name: Upload emulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-fm1-browser
          path: .work/fm1-base/groovescape/build/emu/
          if-no-files-found: error
