name: FM1 native host integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/audio/**'
      - 'scripts/integrate_pad.py'
      - 'tests/test_pad.c'
      - 'tests/native_host.txt'
      - '.github/workflows/native-host.yml'
jobs:
  pad-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C DSP smoke test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_pad.c firmware/audio/pad_dsp.c -lm -o /tmp/gs-pad-test
          /tmp/gs-pad-test
      - name: Validate integration script syntax
        run: python3 -m py_compile scripts/integrate_pad.py
      - name: Get fm1-base
        run: git clone --depth 1 --recurse-submodules https://github.com/charlesvestal/fm1-base.git .work/fm1-base
      - name: Create GrooveScape firmware from upstream template
        run: python3 scripts/integrate_pad.py
      - name: Build host simulator
        run: .work/fm1-base/tools/build.py .work/fm1-base/groovescape --host
      - name: Run FM1 host UI and audio smoke test
        run: .work/fm1-base/groovescape/build/host/groovescape_host tests/native_host.txt .work/fm1-base/groovescape/build/host
      - name: Install Emscripten for browser build
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
      - name: Build browser emulator
        run: .work/fm1-base/tools/build.py .work/fm1-base/groovescape --web
      - name: Upload emulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-fm1-browser
          path: .work/fm1-base/groovescape/build/emu/
