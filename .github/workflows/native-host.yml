name: FM1 native host integration
on:
  workflow_dispatch:
  push:
    paths:
      - 'firmware/audio/**'
      - 'scripts/integrate_pad.py'
      - 'tests/test_pad.c'
      - 'tests/native_host.txt'
      - '.github/workflows/native-host.yml'
permissions:
  contents: write
concurrency:
  group: groovescape-native-build
  cancel-in-progress: false
jobs:
  pad-and-host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Native C DSP smoke test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -fsanitize=address,undefined -fno-omit-frame-pointer tests/test_pad.c firmware/audio/pad_dsp.c -lm -o /tmp/gs-pad-test
          /tmp/gs-pad-test
      - name: Validate integration script syntax
        run: python3 -m py_compile scripts/integrate_pad.py
      - name: Get fm1-base
        run: git clone --depth 1 --recurse-submodules https://github.com/charlesvestal/fm1-base.git .work/fm1-base
      - name: Create GrooveScape firmware from upstream template
        run: python3 scripts/integrate_pad.py
      - name: Build host simulator
        run: .work/fm1-base/tools/build.py .work/fm1-base/groovescape --host
      - name: Run FM1 host UI and audio smoke test
        run: .work/fm1-base/groovescape/build/host/groovescape_host tests/native_host.txt .work/fm1-base/groovescape/build/host
      - name: Upload host smoke-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-host-smoke
          path: .work/fm1-base/groovescape/build/host/
          if-no-files-found: ignore
      - name: Install Emscripten for browser build
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '4.0.21'
      - name: Build browser emulator
        run: .work/fm1-base/tools/build.py .work/fm1-base/groovescape --web
      - name: Verify browser emulator entrypoint
        run: |
          test -s .work/fm1-base/groovescape/build/emu/index.html
          find .work/fm1-base/groovescape/build/emu -maxdepth 1 -type f -printf "%f %s bytes\\n"
      - name: Publish verified native emulator to GitHub Pages folder
        if: success() && github.ref == 'refs/heads/main'
        run: |
          mkdir -p native
          cp -a .work/fm1-base/groovescape/build/emu/. native/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f native
          if ! git diff --cached --quiet; then
            git commit -m "Publish tested GrooveScape FM1 browser emulator [skip ci]"
            git push origin HEAD:main
          fi
      - name: Upload emulator artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: groovescape-fm1-browser
          path: .work/fm1-base/groovescape/build/emu/
